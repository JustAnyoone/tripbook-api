# Render Blueprint: one free web service that runs the API and the front-end together.
# The database is NOT created here: Render has no managed MySQL, so point the three
# database variables at any MySQL 8 (for example Aiven's free plan). See the README.
services:
  - type: web
    name: tripbook
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    # The college assignment stays frozen on main; the live site follows portfolio and redeploys on every merge
    branch: portfolio
    autoDeploy: true
    healthCheckPath: /login
    envVars:
      - key: SERVER_PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
