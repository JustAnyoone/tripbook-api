spring.application.name=tripbook-test

# Tests use an in-memory H2 database, so they never touch the real MySQL.
# This file shadows src/main/resources/application.properties while tests run.
spring.datasource.url=jdbc:h2:mem:tripbook-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# No dialect set on purpose: Hibernate detects H2 by itself
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Same cap as the main file (this file replaces it while tests run)
spring.data.web.pageable.max-page-size=100

# Mail sender bean for the notification service; nothing is sent during tests
spring.mail.host=localhost
