spring.application.name=tripbook

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/tripbook?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
# Printing every SQL statement to the console slows each request; turn it on with SHOW_SQL=true when debugging
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
# Release the database connection as soon as the service method returns, not after the JSON is written
spring.jpa.open-in-view=false

# Email (SendGrid SMTP relay). Set MAIL_PASSWORD to your SendGrid API key in Render env vars.
spring.mail.host=smtp.sendgrid.net
spring.mail.port=587
spring.mail.username=apikey
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Gzip JSON, HTML, CSS and JS responses (the front-end is served by this app in the single-container image)
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,text/javascript,image/svg+xml
server.compression.min-response-size=1024
