name: CI

# Runs the full test suite on every push and pull request.
on:
  push:
    branches: [main, portfolio]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Files committed from Windows may lose the executable bit
      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      # Tests use in-memory H2 (src/test/resources/application.properties),
      # so no MySQL service is needed here.
      - name: Build and run tests
        run: |
          set -o pipefail
          ./mvnw -B verify 2>&1 | tee build.log

      # Copies the Maven result into the run's annotations, so it shows on the summary page
      - name: Show test summary and errors
        if: always()
        run: |
          SUMMARY=$(grep -E "Tests run:.*Skipped" build.log | tail -1)
          echo "::notice title=Test summary::${SUMMARY}"
          if grep -qE "ERROR|FAIL" build.log; then
            MSG=$(grep -E "ERROR|FAIL" build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Maven errors::${MSG}"
          fi
          # Spring start-up failures explain themselves in the lines after the banner
          if grep -q "APPLICATION FAILED TO START" build.log; then
            WHY=$(grep -m1 -A14 "APPLICATION FAILED TO START" build.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Start-up failure::${WHY}"
          fi
          if grep -q "Caused by" build.log; then
            CAUSE=$(grep -m6 "Caused by" build.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Root causes::${CAUSE}"
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run the tests
        run: npm test

      # Type-checks and builds the production bundle
      - name: Build
        run: npm run build
