name: CI

# Runs the full test suite on every push and pull request.
on:
  push:
    branches: [main, portfolio]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Files committed from Windows may lose the executable bit
      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      # Tests use in-memory H2 (src/test/resources/application.properties),
      # so no MySQL service is needed here.
      - name: Build and run tests
        run: |
          set -o pipefail
          ./mvnw -B verify 2>&1 | tee build.log

      # Copies the Maven result into the run's annotations, so it shows on the summary page
      - name: Show test summary and errors
        if: always()
        run: |
          SUMMARY=$(grep -E "Tests run:.*Skipped" build.log | tail -1)
          echo "::notice title=Test summary::${SUMMARY}"
          if grep -qE "ERROR|FAIL" build.log; then
            MSG=$(grep -E "ERROR|FAIL" build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Maven errors::${MSG}"
          fi
          # Spring start-up failures explain themselves in the lines after the banner
          if grep -q "APPLICATION FAILED TO START" build.log; then
            WHY=$(grep -m1 -A14 "APPLICATION FAILED TO START" build.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Start-up failure::${WHY}"
          fi
          if grep -q "Caused by" build.log; then
            CAUSE=$(grep -m6 "Caused by" build.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Root causes::${CAUSE}"
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run the tests
        run: npm test

      # Type-checks and builds the production bundle
      - name: Build
        run: npm run build

  # Builds the three images and starts the whole stack, then talks to it like a user would:
  # create an account through the front-end's nginx, use the token on a protected route.
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up --build -d

      - name: Wait for the API and run a smoke test
        run: |
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3000/api/auth/login \
              -H "Content-Type: application/json" -d '{"email":"x@x.com","password":"wrong-password"}' || true)
            [ "$CODE" = "401" ] && break
            sleep 5
          done
          echo "login probe answered $CODE"
          [ "$CODE" = "401" ]

          TOKEN=$(curl -sf -X POST http://localhost:3000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"name":"CI User","email":"ci@example.com","password":"a-long-passphrase"}' \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['token'])")

          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/destinations)" = "401"
          curl -sf -H "Authorization: Bearer $TOKEN" http://localhost:3000/api/destinations
          curl -sf http://localhost:3000/ | grep -q "<div id=\"root\">"

      - name: Show container logs when something failed
        if: failure()
        run: docker compose logs --no-color --tail=80 | head -150 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | xargs -0 -I{} echo "::error title=Container logs::{}"

      - name: Stop the stack
        if: always()
        run: docker compose down -v
